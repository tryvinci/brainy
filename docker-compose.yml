services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: brainy
      POSTGRES_PASSWORD: brainy
      POSTGRES_DB: brainy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainy -d brainy"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      BRAINY_ENV: development
      BRAINY_HTTP_ADDR: ":8080"
      BRAINY_DATABASE_URL: postgres://brainy:brainy@postgres:5432/brainy?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/brainy-worker"]
    environment:
      BRAINY_ENV: development
      BRAINY_DATABASE_URL: postgres://brainy:brainy@postgres:5432/brainy?sslmode=disable
      BRAINY_WORKER_MODE: loop
      BRAINY_WORKER_POLL_INTERVAL: 2s
    depends_on:
      postgres:
        condition: service_healthy
